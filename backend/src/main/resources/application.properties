server.port=${PORT:8080}
spring.application.name=CivicPulseNexus

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/civicpulse_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Root@2025}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.cache.type=caffeine
spring.cache.cache-names=dashboardKpiCache,dashboardKpis,departmentPerformance,grievanceMetrics,serviceMetrics,permitMetrics,budgetMetrics,citizenMetrics

jwt.secret=${JWT_SECRET:9a6747b7444c11b816fa8a8eb543666504a39b369c0d1253457a4192d6e32d161d76378e9198be9031ef09a96e95c1a8a25c7e09ef2a297e64177d853b0e1234}
jwt.expiration.access=900000
jwt.expiration.refresh=604800000

cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://civicpulse-portal.onrender.com}
frontend.url=${FRONTEND_URL:https://civicpulse-portal.onrender.com}

logging.level.com.civicpulse=INFO
